name: Documenter

on:
  push:
    branches: main
    tags: '*'
  pull_request:
  merge_group:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Documenter:
    uses: EpiAware/.github/.github/workflows/documentation.yml@25424fb7f3b6bec94209bab86a42971bd01621ea
    # Case-study docs run MCMC sampling, so the org default of 45 minutes is
    # too tight; run 30292089587 was killed at 45.5 minutes.
    with:
      timeout_minutes: 90
    secrets: inherit  # pragma: allowlist secret
